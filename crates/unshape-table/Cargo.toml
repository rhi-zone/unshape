[package]
name = "unshape-table"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Columnar tabular data: Table/Column values and ops (filter, sort, group-by, join, pivot)"

[features]
default = []
serde = ["dep:serde", "glam/serde"]
dynop = ["dep:unshape-op", "dep:serde_json", "serde"]

[dependencies]
glam.workspace = true
thiserror.workspace = true
unshape-op = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
