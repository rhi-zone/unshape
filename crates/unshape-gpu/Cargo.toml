[package]
name = "unshape-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core types and traits for unshape fields"

[features]
serde = ["dep:serde"]
dynop = ["dep:unshape-op", "dep:serde_json", "serde"]
image-expr = ["dep:unshape-image", "dep:dew-linalg", "dep:dew-core"]

[dependencies]
glam = { workspace = true }
wgpu = "29"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"
thiserror = { workspace = true }
unshape-core = { workspace = true }
unshape-backend = { workspace = true }
unshape-op = { workspace = true, optional = true }
unshape-image = { workspace = true, features = ["wgsl"], optional = true }
dew-linalg = { version = "0.1.0", features = ["4d", "wgsl"], optional = true }
dew-core = { version = "0.1.0", optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
image = "0.25"
